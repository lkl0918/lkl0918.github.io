    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f5f5f5;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 10px;
        }
        #datetime-info {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            font-size: 16px;
        }
        .time-text {
            font-size: 20px;
            font-weight: bold;
            color: #2980b9;
            margin: 5px 0;
        }
        .holiday-text {
            font-size: 14px;
            color: #e74c3c;
            font-weight: bold;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #btn-from {
            background-color: #3498db;
            color: white;
        }
        #btn-from:hover, #btn-from.active {
            background-color: #2980b9;
        }
        #btn-back {
            background-color: #2ecc71;
            color: white;
        }
        #btn-back:hover, #btn-back.active {
            background-color: #27ae60;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #eee;
            padding: 12px;
            text-align: center;
            font-size: 15px;
        }
        th {
            background-color: #f8f9fa;
            color: #2c3e50;
            font-weight: bold;
        }
        tr:nth-child(2) td {
            color: #7f8c8d; /* Last bus color */
        }
        tr:nth-child(3) td {
            font-weight: bold;
            color: #d35400; /* Next bus 1 color */
            font-size: 17px;
        }
        tr:nth-child(4) td {
            color: #2c3e50; /* Next bus 2 color */
        }
        .empty-cell {
            color: #bdc3c7;
        }
    </style>
</head>

        // HK Public Holidays 2026 & 2027 reference (YYYY-MM-DD)
        const hkHolidays = [
            // 2026
            "2026-01-01", "2026-02-17", "2026-02-18", "2026-02-19", "2026-04-03", "2026-04-04", "2026-04-06", "2026-04-07", "2026-05-01", "2026-05-25", "2026-06-19", "2026-07-01", "2026-09-26", "2026-10-01", "2026-10-19", "2026-12-25", "2026-12-26",

        ];

        let currentActiveBtn = null;

        function checkIsHolidayOrWeekend(dateObj) {
            const day = dateObj.getDay();
            if (day === 0 || day === 6) return true; // Sunday or Saturday
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return hkHolidays.includes(`${y}-${m}-${d}`);
        }

        function isPublicHoliday(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return hkHolidays.includes(`${y}-${m}-${d}`);
        }

        function updateDateTime() {
            const now = new Date();
            const optionsDate = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            const optionsTime = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            
            document.getElementById('date-display').innerText = now.toLocaleDateString('zh-HK', optionsDate);
            document.getElementById('time-display').innerText = now.toLocaleTimeString('zh-HK', optionsTime);

            const isPH = isPublicHoliday(now);
            document.getElementById('holiday-display').innerText = isPH ? "今天香港是公眾假期" : "今天香港不是公眾假期";
            
            if(currentActiveBtn) showTable(currentActiveBtn);
        }

        function timeToMinutes(timeStr) {
            const parts = timeStr.split(':');
            return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        }

        function getBusTimes(schedule, currentMins) {
            let last = null, next1 = null, next2 = null;
            for (let i = 0; i < schedule.length; i++) {
                if (timeToMinutes(schedule[i][0]) >= currentMins) {
                    last = (i > 0) ? schedule[i-1] : null;
                    next1 = schedule[i];
                    next2 = (i + 1 < schedule.length) ? schedule[i+1] : null;
                    return [last, next1, next2];
                }
            }
            // All buses have passed for the day
            return [schedule[schedule.length - 1], null, null];
        }

        function formatBus(bus) {
            if (!bus) return '<span class="empty-cell">-</span>';
            const timeStr = bus[0];
            const prop = bus[1] || 'normal';
            if (prop === 'star') return '⭐ ' + timeStr;
            if (prop === 'special') return '🚩 ' + timeStr;
            return timeStr;
        }

        function showTable(direction) {
            currentActiveBtn = direction;
            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();
            const isWeekendOrHoliday = checkIsHolidayOrWeekend(now);

            let schedA, schedB, schedC;

            if (direction === 'from') {
                schedA = isWeekendOrHoliday ? weekend_from_a : weekday_from_a;
                schedB = isWeekendOrHoliday ? weekend_from_b : weekday_from_b;
                schedC = isWeekendOrHoliday ? weekend_from_c : weekday_from_c;
                
                const resA = getBusTimes(schedA, currentMins);
                const resB = getBusTimes(schedB, currentMins);
                const resC = getBusTimes(schedC, currentMins);

                const html = `

                            <th>B線 (天鑽出發)</th>
                            <th>C線 (天鑽出發)</th>
                        </tr>

                        </tr>
                        <tr>

                            <td>${formatBus(resC[2])}</td>

                            <td>${formatBus(resB[2])}</td>
                        </tr>
                    </table>
                `;
                document.getElementById('table-container').innerHTML = html;
            }
