<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Regent Shuttle Bus Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .route-A { background-color: #ccfbf1; color: #115e59; border-color: #99f6e4; }
        .route-B { background-color: #f3f4f6; color: #1f2937; border-color: #e5e7eb; }

    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-800 p-6 text-center">
            <h1 class="text-2xl font-bold text-white mb-1">The Regent</h1>
            <p class="text-blue-200 text-sm font-medium">Shuttle Bus Schedule</p>
        </div>

        <div class="p-6">
            <!-- Current Time Display -->
            <div class="flex justify-between items-center bg-blue-50 text-blue-800 p-4 rounded-xl mb-6 shadow-sm border border-blue-100">
                <div>
                    <p class="text-xs font-semibold uppercase tracking-wider text-blue-600 mb-1">Current Time</p>
                    <p id="live-time" class="text-xl font-bold">--:--:--</p>
                </div>
                <div class="text-right">
                    <p id="live-day" class="text-sm font-medium">---</p>
                    <p id="live-date" class="text-xs text-blue-600">---</p>
                </div>
            </div>

            <!-- Buttons -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <button onclick="checkSchedule('to')" class="flex flex-col items-center justify-center p-4 bg-white border-2 border-blue-600 text-blue-600 rounded-xl hover:bg-blue-600 hover:text-white transition-colors duration-200 shadow-sm group active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-2 group-hover:-translate-y-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <span class="font-bold text-sm text-center">To The Regent</span>
                </button>
                <button onclick="checkSchedule('from')" class="flex flex-col items-center justify-center p-4 bg-white border-2 border-emerald-600 text-emerald-600 rounded-xl hover:bg-emerald-600 hover:text-white transition-colors duration-200 shadow-sm group active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-2 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                    </svg>
                    <span class="font-bold text-sm text-center">From The Regent</span>
                </button>
            </div>

            <!-- Results Area -->
            <div id="results-area" class="hidden">
                <div class="flex items-center justify-between mb-4">
                    <h2 id="result-title" class="text-lg font-bold text-gray-800">Next Buses</h2>
                    <span id="calculated-time" class="text-xs font-medium text-gray-500 bg-gray-100 px-2 py-1 rounded-full"></span>
                </div>
                
                <div id="buses-container" class="space-y-3">
                    <!-- Buses will be injected here -->
                </div>
            </div>
        </div>
    </div>

        function updateLiveTime() {
            const now = new Date();
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            
            // Format Time (HH:MM:SS)
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('live-time').textContent = `${hours}:${minutes}:${seconds}`;
            document.getElementById('live-day').textContent = days[now.getDay()];
            document.getElementById('live-date').textContent = `${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
        }
        
        // Start the clock
        setInterval(updateLiveTime, 1000);
        updateLiveTime();

        function checkSchedule(direction) {
            const now = new Date();
            const dayOfWeek = now.getDay();
            // 0 is Sunday, 6 is Saturday
            const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
            const dayType = isWeekend ? 'weekend' : 'weekday';
            
            // Get current time in minutes from midnight for easy comparison
            const currentTotalMinutes = now.getHours() * 60 + now.getMinutes();
            
            // Format current time display for results header
            const timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            // Fetch relevant schedule
            const scheduleArray = scheduleData[dayType][direction];
            
            // Filter buses that are >= current time
            const upcomingBuses = scheduleArray.filter(bus => {
                const [timeStr, route] = bus;
                const [busHours, busMinutes] = timeStr.split(':').map(Number);
                const busTotalMinutes = busHours * 60 + busMinutes;
                return busTotalMinutes >= currentTotalMinutes;
            });

            // Get next 2 buses max
            const nextBusesToDisplay = upcomingBuses.slice(0, 2);
            
            displayResults(nextBusesToDisplay, direction, timeString, dayType);
        }

        function displayResults(buses, direction, calculatedTime, dayType) {
            const resultsArea = document.getElementById('results-area');
            const title = document.getElementById('result-title');
            const calcTimeLabel = document.getElementById('calculated-time');
            const container = document.getElementById('buses-container');
            
            // Show the container
            resultsArea.classList.remove('hidden');
            
            // Update Headers
            const directionText = direction === 'to' ? 'To The Regent' : 'From The Regent';
            const dayText = dayType === 'weekend' ? 'Weekend' : 'Weekday';
            title.textContent = directionText;
            calcTimeLabel.textContent = `As of ${calculatedTime} (${dayText})`;
            
            // Clear previous results
            container.innerHTML = '';
            
            if (buses.length === 0) {
                container.innerHTML = `
                    <div class="bg-gray-50 border border-gray-200 text-gray-500 rounded-lg p-5 text-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mx-auto mb-2 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <p class="font-semibold text-sm">No more buses scheduled for today.</p>
                    </div>
                `;
                return;
            }

            buses.forEach((bus, index) => {
                const [time, route] = bus;
                const nextLabel = index === 0 ?

                const cardHtml = `
                    <div class="relative flex items-center justify-between p-4 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md transition-shadow">
                        ${nextLabel}
                        <div class="flex items-center gap-4">
                            <div class="flex flex-col items-center justify-center w-12 h-12 rounded-lg border-2 route-${route} shadow-inner">

                            </div>
                            <div class="flex flex-col">

                                <span class="text-2xl font-bold text-gray-800">${time}</span>
                            </div>
                        </div>

                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />

                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }
    </script>
